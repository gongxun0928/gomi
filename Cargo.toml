[package]
name = "gomi"
version = "0.1.0"
edition = "2021"
description = "Explain developer disk usage on macOS. CLI clean is dry-run; TUI can Trash marked suggest_trash items after confirm."
license = "MIT"
publish = false

[dependencies]
blake3 = "1"
camino = "1"
clap = { version = "4", features = ["derive"] }
crossterm = "0.28"
dirs = "6"
ratatui = "0.29"
serde = { version = "1", features = ["derive"] }
thiserror = "2"
toml = "0.8"
trash = "5"
